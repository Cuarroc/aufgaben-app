<body>
  <header class="titlebar"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>Aufgaben</div><div class="window-meta"><span class="draft">Entwurf</span><div class="window-controls" aria-hidden="true"><span><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></span><span><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg></span><span><svg viewBox="0 0 16 16"><path d="m3 3 10 10M13 3 3 13"/></svg></span></div></div></header>
  <div class="shell" id="app"></div>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description"></dialog>
  <script>
    'use strict';
    // Statischer Entwurf: Änderungen bleiben nur bis zum Neuladen im Arbeitsspeicher.
    const icons={folder:'<path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>',computer:'<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',tasks:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 1 1 2-2M14 9h3M8 15h9"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>'};
    const icon=name=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[name]||icons.tasks}</svg>`;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusNames=['Offen','In Arbeit','Erledigt'];
    const projects=[{name:'Umzug Wohnung',tasks:[{title:'Kartons besorgen',status:2,description:'Kartons und Packband für den Umzug besorgen.',due:''},{title:'Ummeldung Bürgeramt',status:0,description:'Termin beim Bürgeramt vereinbaren.\nPersonalausweis und Wohnungsgeberbestätigung mitnehmen.',due:'2026-10-28'},{title:'Internet kündigen',status:1,description:'Kündigungsfrist prüfen und den Anbieter kontaktieren.',due:''},{title:'Nachsendeauftrag',status:0,description:'Nachsendeauftrag für die neue Adresse einrichten.',due:''},{title:'Schlüsselübergabe',status:0,description:'Übergabetermin mit der Vermieterin abstimmen.',due:'2026-10-31'}]},{name:'Bewerbung IT-Ausbildung',tasks:[{title:'Lebenslauf aktualisieren',status:2,description:'Praktikum und aktuelle Kenntnisse ergänzen.',due:''},{title:'Anschreiben formulieren',status:1,description:'Motivation für die Ausbildung beschreiben.',due:'2026-10-25'},{title:'Bewerbung abschicken',status:0,description:'Unterlagen als PDF zusammenstellen und versenden.',due:'2026-10-30'}]},{name:'Steuererklärung 2025',tasks:[{title:'Belege zusammenstellen',status:2,description:'Belege für das Steuerjahr 2025 sammeln.',due:''},{title:'Erklärung über ELSTER abgeben',status:2,description:'Angaben prüfen und Erklärung übermitteln.',due:''}]}];
    const app=document.getElementById('app'),dialog=document.getElementById('confirm');
    let selected=0,filter=-1,panel=false,editing=1,isNew=false,invalid=false,saveError=false,draft=null,toastTimer,lastDialogTrigger=null,deleteTarget=null;
    const activeTasks=project=>project.tasks.filter(t=>!t.archived);
    const openCount=project=>activeTasks(project).filter(t=>t.status!==2).length;
    const chip=status=>`<span class="chip ${status===1?'working':status===2?'done':''}"><span class="dot"></span>${statusNames[status]}</span>`;
    const dateLabel=date=>date?`${date.slice(8,10)}.${date.slice(5,7)}.`:'';
    function sidebar(archive){return `<aside class="sidebar"><nav aria-label="Projekte"><h2 class="section-label">Projekte</h2><ul>${projects.map((p,i)=>(p.archived||p.deleted)?'':`<li><a href="#${i===0?'main':i===1?'switch':i===2?'tax':'empty'}" data-project="${i}" class="project-link ${!archive&&selected===i?'active':''}" ${!archive&&selected===i?'aria-current="page"':''}>${icon('folder')}<span class="project-name">${escapeHtml(p.name)}</span><span class="count" aria-label="${openCount(p)} offene Aufgaben">${openCount(p)}</span></a></li>`).join('')}</ul><button class="new-project" data-action="new-project">${icon('plus')}Neues Projekt</button></nav><div class="sidebar-bottom"><a href="#archive-list" class="nav-link ${archive?'active':''}" ${archive?'aria-current="page"':''}>${icon('archive')}<span>Archiv</span><span class="count">${archivedItems().length}</span></a><div class="local">${icon('computer')}Lokal auf diesem Gerät</div></div></aside>`}
    function archivedItems(){let items=[];projects.forEach((p,pi)=>{if(p.deleted)return;if(p.archived)items.push({name:p.name,kind:'Projekt',pi,count:p.tasks.length});else p.tasks.forEach((t,ti)=>{if(t.archived)items.push({name:t.title,kind:'Aufgabe',pi,ti})})});return items}
    function render(){
      const archive=location.hash.startsWith('#archive');
      app.innerHTML=sidebar(archive)+`<main class="main ${panel?'with-panel':''}" id="main-content">${archive?archiveView():projectView()}${panel?panelView():''}</main>`;
      if(panel){const form=document.getElementById('task-form');form.addEventListener('input',syncDraft);form.addEventListener('change',syncDraft);form.addEventListener('submit',saveTask)}
    }
    function projectView(){const project=projects[selected],tasks=activeTasks(project),done=tasks.filter(t=>t.status===2).length,visible=project.tasks.map((t,i)=>({...t,i})).filter(t=>!t.archived&&(filter<0||filter===t.status));return `<section class="workspace" aria-labelledby="project-title"><div class="eyebrow">${icon('folder')}Projekt</div><div class="heading"><div><h1 id="project-title">${escapeHtml(project.name)}</h1><p class="subtitle">${tasks.length===0?'Platz für deinen nächsten Schritt.':`${tasks.length} Aufgaben <span aria-hidden="true">·</span> ${done} erledigt`}</p></div><div class="project-actions"><button class="icon-button" data-action="project-menu" aria-label="Projektoptionen" aria-expanded="false">${icon('dots')}</button><div class="project-menu" hidden><button data-action="archive-project">Projekt archivieren</button></div></div></div><div class="toolbar"><div class="filters" aria-label="Aufgaben filtern">${[-1,0,1,2].map(s=>`<button class="filter ${filter===s?'active':''}" data-filter="${s}" aria-pressed="${filter===s}">${s<0?'Alle':statusNames[s]}<span class="filter-count">${s<0?tasks.length:tasks.filter(t=>t.status===s).length}</span></button>`).join('')}</div>${tasks.length?`<button class="button primary" data-action="new-task">${icon('plus')}Neue Aufgabe</button>`:''}</div>${tasks.length===0?`<div class="empty-state"><div class="empty-icon">${icon('tasks')}</div><h2>Hier beginnt dein Projekt.</h2><p>Eine kleine Aufgabe ist ein guter Anfang.<br>Was möchtest du als Erstes erledigen?</p><button class="button primary" data-action="new-task">${icon('plus')}Erste Aufgabe anlegen</button></div>`:`<div class="list-label"><span>${filter<0?'Alle Aufgaben':statusNames[filter]}</span><span>${visible.length} ${visible.length===1?'Aufgabe':'Aufgaben'}</span></div>${visible.length?`<ul class="task-list" aria-label="Aufgaben">${visible.map(t=>`<li class="task ${t.status===2?'done':''} ${panel&&!isNew&&editing===t.i?'selected':''}"><button class="status-control ${t.status===2?'done':t.status===1?'working':''}" data-toggle="${t.i}" aria-label="${escapeHtml(t.title)}: ${statusNames[t.status]}. ${t.status===2?'Als offen markieren':'Als erledigt markieren'}">${t.status===2?icon('check'):''}</button><button class="task-title" data-edit="${t.i}">${escapeHtml(t.title)}</button>${t.due?`<span class="task-date" aria-label="Fällig am ${dateLabel(t.due)}2026">${icon('calendar')}${dateLabel(t.due)}</span>`:''}${chip(t.status)}</li>`).join('')}</ul>`:`<div class="empty-state"><div class="empty-icon">${icon('check')}</div><h2>Hier ist alles erledigt.</h2><p>Für diesen Filter gibt es gerade keine Aufgaben.</p><button class="button" data-filter="-1">Alle Aufgaben anzeigen</button></div>`}<p class="list-footer">${icon('info')}Zum Bearbeiten auf einen Aufgabentitel klicken.</p>`}</section>`}
    function panelView(){return `<aside class="panel ${saveError?'has-error':''}" aria-labelledby="panel-title"><div class="panel-header"><h2 id="panel-title">${isNew?'Neue Aufgabe':'Aufgabe bearbeiten'}</h2><button class="icon-button" data-action="close-panel" aria-label="Bearbeitung schließen">${icon('close')}</button></div><form id="task-form" class="panel-body">${saveError?`<div class="banner" role="alert"><div class="banner-title">${icon('info')}<span>Konnte nicht speichern: Datei ist schreibgeschützt.</span></div><p>Deine Eingaben sind noch da.</p><button type="button" class="retry" data-action="retry">Erneut versuchen</button></div>`:''}<div class="field"><label for="task-title">Titel <span class="required">(Pflichtfeld)</span></label><input id="task-title" name="title" required value="${escapeHtml(draft.title)}" aria-invalid="${invalid}" ${invalid?'aria-describedby="title-error"':''}><p id="title-error" class="error" ${invalid?'':'hidden'}>${icon('info')}Bitte einen Titel eingeben.</p></div><div class="field"><label for="task-description">Beschreibung <span class="optional">(optional)</span></label><textarea id="task-description" name="description">${escapeHtml(draft.description)}</textarea></div><div class="field-row"><div class="field"><label for="task-status">Status</label><select id="task-status" name="status">${statusNames.map((s,i)=>`<option value="${i}" ${draft.status===i?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="task-due">Fällig am</label><input id="task-due" type="date" lang="de" name="due" value="${draft.due}" aria-describedby="due-note"><p id="due-note" class="field-note">Optional</p></div></div></form><div class="panel-footer"><div class="panel-buttons"><button class="button primary" id="save-button" form="task-form" ${!draft.title.trim()?'disabled':''} ${invalid?'aria-describedby="title-error"':''}>Speichern</button><button type="button" class="button" data-action="close-panel">Abbrechen</button></div>${!isNew?`<button class="archive-task" data-action="archive-task">${icon('archive')}Archivieren</button>`:''}</div></aside>`}
    function archiveView(){return `<section class="workspace" aria-labelledby="archive-title"><div class="eyebrow">${icon('archive')}Ablage</div><h1 id="archive-title">Archiv</h1><p class="archive-info">Archivierte Projekte und Aufgaben bleiben hier erhalten.<br>Du kannst sie wiederherstellen oder endgültig löschen.</p><div class="archive-section"><div class="list-label"><span>Archivierte Elemente</span><span>${archivedItems().length} ${archivedItems().length===1?'Element':'Elemente'}</span></div>${archivedItems().length?archivedItems().map((item,i)=>`<div class="archive-row">${icon(item.kind==='Projekt'?'folder':'tasks')}<div class="archive-item"><strong>${escapeHtml(item.name)}</strong><p>${item.kind}${item.count!==undefined?` · ${item.count} erledigte Aufgaben`:` · ${escapeHtml(projects[item.pi].name)}`}</p></div><button class="text-button" data-restore="${i}">Wiederherstellen</button><button class="text-button delete-button" data-delete="${i}">Endgültig löschen</button></div>`).join(''):'<p class="archive-empty">Dein Archiv ist leer.</p>'}</div></section>`}
    function syncDraft(){const form=document.getElementById('task-form');draft={title:form.elements.title.value,description:form.elements.description.value,status:Number(form.elements.status.value),due:form.elements.due.value};invalid=!draft.title.trim();const input=form.elements.title,error=document.getElementById('title-error'),save=document.getElementById('save-button');input.setAttribute('aria-invalid',String(invalid));error.hidden=!invalid;save.disabled=invalid;if(invalid){input.setAttribute('aria-describedby','title-error');save.setAttribute('aria-describedby','title-error')}else{input.removeAttribute('aria-describedby');save.removeAttribute('aria-describedby')}}
    function openPanel(index,fresh=false,focus=true){editing=index;isNew=fresh;panel=true;invalid=false;saveError=false;draft=fresh?{title:'',description:'',status:0,due:''}:{...projects[selected].tasks[index]};render();if(focus)document.getElementById('task-title').focus()}
    function closePanel(){panel=false;saveError=false;render();const target=isNew?document.querySelector('[data-action="new-task"]'):document.querySelector(`[data-edit="${editing}"]`);target?.focus()}
    function saveTask(event){event?.preventDefault();syncDraft();if(invalid)return;if(saveError){render();return}draft.title=draft.title.trim();if(isNew)projects[selected].tasks.push({...draft});else Object.assign(projects[selected].tasks[editing],draft);closePanel();notify('Aufgabe gespeichert.');}
    function notify(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const element=document.createElement('div');element.className='toast';element.setAttribute('role','status');element.textContent=message;document.querySelector('.main').append(element);toastTimer=setTimeout(()=>element.remove(),3500)}
    function askDelete(item,trigger){deleteTarget=item;lastDialogTrigger=trigger;dialog.innerHTML=`<div class="dialog-body"><div class="dialog-icon">${icon('trash')}</div><h2 id="confirm-title">„${escapeHtml(item.name)}“ endgültig löschen?</h2><p id="confirm-description">Das kann nicht rückgängig gemacht werden.</p></div><div class="dialog-actions"><button class="button" data-action="cancel-delete" autofocus>Abbrechen</button><button class="button danger" data-action="confirm-delete">Endgültig löschen</button></div>`;dialog.showModal();dialog.querySelector('[autofocus]').focus()}
    dialog.addEventListener('close',()=>{if(lastDialogTrigger?.isConnected)lastDialogTrigger.focus();else document.querySelector('[data-action="new-project"]')?.focus()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&panel&&!dialog.open){event.preventDefault();closePanel()}});
    document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;
      if(target.dataset.project!==undefined){event.preventDefault();selected=Number(target.dataset.project);filter=-1;panel=false;const route=selected===0?'main':selected===1?'switch':selected===2?'tax':'empty';if(location.hash==='#'+route)render();else location.hash=route;return}
      if(target.dataset.filter!==undefined){filter=Number(target.dataset.filter);render();document.querySelector(`[data-filter="${filter}"]`)?.focus();return}
      if(target.dataset.edit!==undefined){openPanel(Number(target.dataset.edit));return}
      if(target.dataset.toggle!==undefined){const task=projects[selected].tasks[Number(target.dataset.toggle)];task.status=task.status===2?0:2;render();document.querySelector(`[data-toggle="${target.dataset.toggle}"]`)?.focus();return}
      if(target.dataset.delete!==undefined){askDelete(archivedItems()[Number(target.dataset.delete)],target);return}
      if(target.dataset.restore!==undefined){const item=archivedItems()[Number(target.dataset.restore)];if(item.kind==='Projekt')projects[item.pi].archived=false;else projects[item.pi].tasks[item.ti].archived=false;render();notify(`„${item.name}“ wiederhergestellt.`);return}
      switch(target.dataset.action){case 'new-project':if(projects.length===3)projects.push({name:'Neues Projekt',tasks:[]});selected=3;if(location.hash==='#empty'){panel=false;filter=-1;render()}else location.hash='empty';break;case 'new-task':openPanel(-1,true);break;case 'close-panel':closePanel();break;case 'project-menu':{const menu=document.querySelector('.project-menu');menu.hidden=!menu.hidden;target.setAttribute('aria-expanded',String(!menu.hidden));break}case 'archive-project':projects[selected].archived=true;panel=false;location.hash='archive-list';break;case 'archive-task':projects[selected].tasks[editing].archived=true;panel=false;render();notify('Aufgabe ins Archiv verschoben.');break;case 'retry':syncDraft();saveError=false;saveTask();break;case 'cancel-delete':dialog.close();break;case 'confirm-delete':{const item=deleteTarget;if(item.kind==='Projekt')projects[item.pi].deleted=true;else projects[item.pi].tasks.splice(item.ti,1);dialog.close();render();notify(`„${item.name}“ endgültig gelöscht.`);break}}
    });
    function route(){if(dialog.open)dialog.close();const view=location.hash.slice(1)||'main';selected=view==='switch'?1:view==='tax'?2:view==='empty'?3:0;filter=view==='filter'?0:-1;panel=['edit','invalid','saveerror'].includes(view);invalid=view==='invalid';saveError=view==='saveerror';isNew=false;editing=1;
      if(view==='empty'&&!projects[3])projects.push({name:'Neues Projekt',tasks:[]});
      if(view==='archive')projects[2].archived=true;
      if(panel){draft={...projects[0].tasks[1]};if(invalid)draft.title='';if(saveError)draft.description='Termin am 28.10. um 09:30 Uhr gebucht.\nPersonalausweis und Wohnungsgeberbestätigung mitnehmen.'}
      render();if(view==='archive')askDelete(archivedItems().find(i=>i.name==='Steuererklärung 2025'),null);
    }
    addEventListener('hashchange',route);route();
  </script>
</body>
</html>
